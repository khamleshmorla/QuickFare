    <script>
        const GOMAPS_API_KEY = "AlzaSyZ5OC1nbpF369im1q9BueogaIIR5T50g8x";

        // Dark Mode Toggle
        document.getElementById('darkModeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        });
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        const fares = {
            bike: [
                { service: "🏍️ Rapido Bike", price: "₹50", eta: "10 min", deeplink: "rapido://ride?pickup={pickup}&drop={drop}" },
                { service: "🚴 Ola Bike", price: "₹55", eta: "12 min", deeplink: "ola://ride?pickup={pickup}&destination={drop}&category=bike" },
                { service: "🏍️ Uber Moto", price: "₹52", eta: "11 min", deeplink: "uber://?action=setPickup&pickup[latitude]={pickupLat}&pickup[longitude]={pickupLng}&dropoff[latitude]={dropLat}&dropoff[longitude]={dropLng}&product_id=moto" }
            ],
            auto: [
                { service: "🛺 Ola Auto", price: "₹70", eta: "15 min", deeplink: "ola://ride?pickup={pickup}&destination={drop}&category=auto" },
                { service: "🚜 Uber Auto", price: "₹75", eta: "14 min", deeplink: "uber://?action=setPickup&pickup[latitude]={pickupLat}&pickup[longitude]={pickupLng}&dropoff[latitude]={dropLat}&dropoff[longitude]={dropLng}&product_id=auto" }
            ],
            car: [
                { service: "🚗 Ola Mini", price: "₹120", eta: "18 min", deeplink: "ola://ride?pickup={pickup}&destination={drop}&category=mini" },
                { service: "🚖 UberGo", price: "₹125", eta: "17 min", deeplink: "uber://?action=setPickup&pickup[latitude]={pickupLat}&pickup[longitude]={pickupLng}&dropoff[latitude]={dropLat}&dropoff[longitude]={dropLng}&product_id=ubergo" },
                { service: "🚙 Ola Sedan", price: "₹140", eta: "20 min", deeplink: "ola://ride?pickup={pickup}&destination={drop}&category=sedan" }
            ]
        };

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                pickup: params.get("pickup"),
                drop: params.get("drop"),
                rideType: params.get("rideType")
            };
        }

        async function fetchDistanceAndTime(pickup, drop) {
            const service = new google.maps.DistanceMatrixService();
            try {
                const response = await service.getDistanceMatrix({
                    origins: [pickup],
                    destinations: [drop],
                    travelMode: google.maps.TravelMode.DRIVING,
                    unitSystem: google.maps.UnitSystem.METRIC
                });

                if (response.rows[0].elements[0].status === "OK") {
                    const distance = response.rows[0].elements[0].distance;
                    const duration = response.rows[0].elements[0].duration;
                    document.getElementById("distance").innerText = distance.text;
                    document.getElementById("time").innerText = duration.text;
                    return { distance, duration };
                } else {
                    document.getElementById("distance").innerText = "N/A";
                    document.getElementById("time").innerText = "N/A";
                    return null;
                }
            } catch (error) {
                console.error("Error fetching distance:", error);
                document.getElementById("distance").innerText = "Error";
                document.getElementById("time").innerText = "Error";
                return null;
            }
        }

        async function geocodeLocation(address) {
            const geocoder = new google.maps.Geocoder();
            try {
                const response = await geocoder.geocode({ address });
                if (response.results.length > 0) {
                    const location = response.results[0].geometry.location;
                    return {
                        lat: location.lat(),
                        lng: location.lng()
                    };
                }
                return null;
            } catch (error) {
                console.error("Geocoding error:", error);
                return null;
            }
        }

        // Fare calculation algorithms
        const fareAlgorithms = {
            // Ola fare calculation
            ola: {
                bike: (distance) => {
                    const baseFare = 25;
                    const perKm = 3.5;
                    const minFare = distance <= 2 ? 28 : (distance <= 5 ? 33 : 38);
                    const fare = baseFare + (distance * perKm);
                    return Math.max(fare, minFare);
                },
                auto: (distance) => {
                    const baseFare = 30;
                    const perKm = 4.5;
                    const minFare = distance <= 2 ? 33 : (distance <= 5 ? 39 : 45);
                    const fare = baseFare + (distance * perKm);
                    return Math.max(fare, minFare);
                },
                mini: (distance) => {
                    const baseFare = 35;
                    const perKm = 6.5;
                    const minFare = distance <= 2 ? 39 : (distance <= 5 ? 46 : 53);
                    const fare = baseFare + (distance * perKm);
                    return Math.max(fare, minFare);
                },
                sedan: (distance) => {
                    const baseFare = 40;
                    const perKm = 7;
                    const minFare = distance <= 2 ? 44 : (distance <= 5 ? 52 : 60);
                    const fare = baseFare + (distance * perKm);
                    return Math.max(fare, minFare);
                },
                prime: (distance) => {
                    const baseFare = 45;
                    const perKm = 8.5;
                    const minFare = distance <= 2 ? 50 : (distance <= 5 ? 59 : 68);
                    const fare = baseFare + (distance * perKm);

        async function displayFares() {

            const pickupCoords = await geocodeLocation(pickup);
            const dropCoords = await geocodeLocation(drop);

            const map = new google.maps.Map(document.getElementById('map'), {

                        "elementType": "geometry",

                    }

            });

            if (pickupCoords && dropCoords) {
                // Add markers
                new google.maps.Marker({

                new google.maps.Marker({
                    position: dropCoords,
                    map: map,
                    title: "Drop"
                });

                // Draw route
                const directionsService = new google.maps.DirectionsService();
                const directionsRenderer = new google.maps.DirectionsRenderer({
                    map: map,
                    suppressMarkers: true,
                    polylineOptions: {
                        strokeColor: '#f59e0b',
                        strokeWeight: 5
                    }
                });

                directionsService.route({
                    origin: pickupCoords,
                    destination: dropCoords,
                    travelMode: google.maps.TravelMode.DRIVING
                }, (result, status) => {
                    if (status === 'OK') {
                        directionsRenderer.setDirections(result);
                    }
                });

                // Fit bounds
                const bounds = new google.maps.LatLngBounds();
                bounds.extend(pickupCoords);
                bounds.extend(dropCoords);
                map.fitBounds(bounds, { padding: 50 });

                await fetchAndDisplayFares(encodeURIComponent(pickup), encodeURIComponent(drop), encodeURIComponent(newRideType));

            // Initial fetch
            await fetchAndDisplayFares(encodeURIComponent(pickup), encodeURIComponent(drop), encodeURIComponent(rideType));

        // Check if location is already saved (using localStorage)
        function checkIfLocationSaved() {

            const savedLocations = JSON.parse(localStorage.getItem('savedLocations') || '[]');

        // Save location (using localStorage)
        saveLocationForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const { pickup, drop } = getQueryParams();
            const name = locationName.value.trim();

            if (!name) {
                alert('Please enter a location name');
                return;
            }

            try {
                const savedLocations = JSON.parse(localStorage.getItem('savedLocations') || '[]');
                const locationData = {
                    id: Date.now().toString(),
                    name,
                    pickup,
                    drop,
                    createdAt: new Date().toISOString()
                };

                // Avoid duplicates
                const exists = savedLocations.some(loc => loc.pickup === pickup && loc.drop === drop);
                if (!exists) {
                    savedLocations.push(locationData);
                    localStorage.setItem('savedLocations', JSON.stringify(savedLocations));
                }

                // Update UI
                saveLocationBtn.classList.add('saved');
                saveLocationBtn.title = 'Location Saved';
                closeSaveLocationModal();
                alert('Location saved successfully!');

                console.error('Error saving location:', error);
                alert('Failed to save location. Please try again.');
            }
        });

        // Fetch Current Location 
        function fetchCurrentLocation() {
            const pickupInput = document.getElementById('pickupInput');
            
            if (!navigator.geolocation) {
                showToast("Geolocation is not supported by your browser.", "error");
                return;
            }

            const originalPlaceholder = pickupInput.placeholder;
            pickupInput.value = '';
            pickupInput.placeholder = "📍 Locating you...";
            
            const btnIcon = document.querySelector('button[title="Use Current Location"] i');
            if (btnIcon) btnIcon.classList.add('fa-spin');

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    if (btnIcon) btnIcon.classList.remove('fa-spin');
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    try {
                        const geocoder = new google.maps.Geocoder();
                        const latlng = { lat: lat, lng: lng };
                        
                        geocoder.geocode({ location: latlng }, (results, status) => {
                            if (status === "OK" && results[0]) {
                                pickupInput.value = results[0].formatted_address;
                                checkForLocationChanges();
                            } else {
                                pickupInput.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                                checkForLocationChanges();
                            }
                            pickupInput.placeholder = originalPlaceholder;
                        });
                    } catch (e) {
                        pickupInput.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                        pickupInput.placeholder = originalPlaceholder;
                        checkForLocationChanges();
                    }
                },
                (error) => {
                    if (btnIcon) btnIcon.classList.remove('fa-spin');
                    pickupInput.placeholder = originalPlaceholder;
                    let msg = "Error locating.";
                    if (error.code === 1) msg = "Location access denied.";
                    else if (error.code === 2) msg = "Position unavailable. No internet?";
                    else if (error.code === 3) msg = "Location finding timed out.";
                    showToast(msg, "error");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Swap functionality
        function swapAndRefetch() {
            const pickupInput = document.getElementById('pickupInput');
            const dropInput = document.getElementById('dropInput');
            
            const temp = pickupInput.value;
            pickupInput.value = dropInput.value;
            dropInput.value = temp;

            pickupInput.style.transform = 'translateY(5px)';
            dropInput.style.transform = 'translateY(-5px)';
            setTimeout(() => {
                pickupInput.style.transform = '';
                dropInput.style.transform = '';
            }, 100);

            checkForLocationChanges();
        }

        // Autocomplete Setup
        function setupAutocomplete(inputId, resultsId) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const autocomplete = new google.maps.places.Autocomplete(input, {
                types: ['geocode', 'establishment'],
                componentRestrictions: { country: 'in' },
                fields: ['formatted_address', 'geometry', 'name']
            });

            autocomplete.addListener('place_changed', function() {
                const place = autocomplete.getPlace();
                if (place.geometry) {
                    input.value = place.formatted_address;
                    checkForLocationChanges();
                }
            });

            input.addEventListener('input', checkForLocationChanges);
        }

        function checkForLocationChanges() {
            const { pickup: originalPickup, drop: originalDrop } = getQueryParams();
            const currentPickup = document.getElementById('pickupInput').value;
            const currentDrop = document.getElementById('dropInput').value;
            
            const btn = document.getElementById('updateRouteBtn');
            if (currentPickup !== originalPickup || currentDrop !== originalDrop) {
                btn.classList.remove('hidden');
                btn.classList.add('animate__animated', 'animate__fadeInUp');
            } else {
                btn.classList.add('hidden');
            }
        }

            url.searchParams.set('pickup', pickup);
            url.searchParams.set('drop', drop);
            window.history.pushState({}, '', url);

            // Reload page to reinitialize map and fares with new coordinates
            window.location.reload();
        }

                button.addEventListener('mouseleave', () => {
                    anime({
                        targets: button,
                        scale: 1,
                        duration: 300,
                        easing: 'easeOutExpo'
                    });
                });
            });

            // Toast animation
            window.showToast = function(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                
                anime({
                    targets: toast,
                    translateY: [100, 0],
                    opacity: [0, 1],
                    duration: 500,
                    easing: 'easeOutExpo',
                    complete: () => {
                        setTimeout(() => {
                            anime({
                                targets: toast,
                                translateY: [0, 100],
                                opacity: [1, 0],
                                duration: 500,
                                easing: 'easeInExpo'
                            });
                        }, 3000);
                    }
                });
            };
        });
    </script>
</body>
</html>
