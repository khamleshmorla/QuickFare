# ============================================================
# QuickFare — Development Profile (H2 In-Memory)
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:quickfare_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.quickfare: DEBUG
    org.springframework.web: DEBUG
