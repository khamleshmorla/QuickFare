# ============================================================
# QuickFare — Application Configuration
# ============================================================

server:
  port: ${PORT:8080}

# ---- Default Profile ----
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


# ---- External API Configuration ----
quickfare:
  api:
    google-maps:
      key: ${GOOGLE_MAPS_API_KEY:AIzaSyDPrJsx1qkMrAvYwkMMT6Gs6YMWarej_gs}
      distance-matrix-url: https://maps.googleapis.com/maps/api/distancematrix/json
      geocode-url: https://maps.googleapis.com/maps/api/geocode/json
    opencage:
      key: ${OPENCAGE_API_KEY:bbc8d16c8ec249789b79fcdfc7879a6f}
      base-url: https://api.opencagedata.com/geocode/v1/json

  # ---- HTTP Client Timeouts (ms) ----
  http:
    connect-timeout: 5000
    read-timeout: 10000

  # ---- CORS ----
  cors:
    allowed-origins: "*"

# ---- Logging ----
logging:
  level:
    com.quickfare: INFO
    org.springframework.web: INFO
